<div class="login-container">
  <h2>{{ isRegister ? 'Register' : 'Login' }}</h2>

  <form (ngSubmit)="onSubmit()">
    <input [(ngModel)]="username" name="username" placeholder="Username" required />
    <input *ngIf="isRegister" [(ngModel)]="email" name="email" placeholder="Email" required />
    <input [(ngModel)]="password" name="password" placeholder="Password" type="password" required />

    <button type="submit" [disabled]="loading">
      {{ isRegister ? 'Register' : 'Login' }}
    </button>

    <button type="button" (click)="toggleMode()" class="toggle-btn">
      {{ isRegister ? 'Already have an account? Login' : 'New user? Register' }}
    </button>

    <p *ngIf="error" class="error">{{ error }}</p>
  </form>
</div>
